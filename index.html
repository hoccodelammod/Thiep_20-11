<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thiệp Chúc Mừng 20/11 Tri Ân Cô</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 50%, #fda4af 100%);
      --card-pink-dark: #e11d48;
      --card-pink-main: #f43f5e;
      --gold-accent: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-gradient);
    }

    /* Canvas cánh hoa rơi */
    #petal-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Floating Toolbar */
    .controls-bar {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(225, 29, 72, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .btn-tool {
      background: transparent;
      border: none;
      color: var(--card-pink-dark);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-tool:hover {
      background: rgba(244, 63, 94, 0.15);
      transform: scale(1.1);
    }

    /* Card App Container & Drag Wrapper */
    .app-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .drag-wrapper {
      position: absolute;
      cursor: grab;
      touch-action: none;
      transform-origin: center center;
    }

    .drag-wrapper:active {
      cursor: grabbing;
    }

    /* 3D Book Container */
    .book-container {
      width: 360px;
      height: 520px;
      perspective: 1600px;
      position: relative;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @media (max-width: 480px) {
      .book-container {
        width: 310px;
        height: 480px;
      }
    }

    .book-cover {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .book-container.open .book-cover {
      transform: rotateY(-180deg);
    }

    .book-container.open {
      transform: translateX(50%);
    }

    @media (max-width: 768px) {
      .book-container.open {
        transform: translateX(25%) scale(0.85);
      }
    }

    .page-face {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(159, 18, 57, 0.2);
      overflow: hidden;
      background: #fff;
    }

    /* Mặt 1: Bìa Thiệp */
    .page-1 {
      background: linear-gradient(145deg, #fff1f2 0%, #ffe4e6 100%);
      border: 3px solid #fda4af;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
      text-align: center;
    }

    .page-1::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px dashed #f43f5e;
      border-radius: 10px;
      pointer-events: none;
    }

    /* Mặt 2: Trang trong trái */
    .page-2 {
      transform: rotateY(180deg);
      background: #fff;
      border: 1px solid #fecdd3;
      padding: 24px 18px 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Mặt 3: Trang trong phải */
    .page-3 {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #fff;
      border: 1px solid #fecdd3;
      padding: 24px 18px 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Bó hoa trang trí bìa trước */
    .flower-illustration {
      width: 150px;
      height: 150px;
      position: relative;
      margin: 5px auto;
    }

    .flower-illustration svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 15px rgba(225, 29, 72, 0.25));
    }

    .card-title-main {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.2rem, 6vw, 2.7rem);
      color: var(--card-pink-dark);
      line-height: 1.25;
      margin-top: 5px;
    }

    .card-subtitle {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: var(--gold-accent);
      font-weight: 700;
    }

    .open-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #9f1239;
      background: rgba(244, 63, 94, 0.12);
      padding: 8px 18px;
      border-radius: 20px;
      animation: pulse 2s infinite;
      cursor: pointer;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    /* Lời chúc & Tiêu đề phông Script */
    .quote-decor {
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      color: var(--card-pink-dark);
      text-align: center;
      border-bottom: 1px solid #ffe4e6;
      padding-bottom: 4px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    /* Khung chứa văn bản tự cuộn chống tràn/mất chữ */
    .wish-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 8px;
    }

    /* Tùy chỉnh thanh cuộn siêu mỏng đẹp mắt */
    .wish-scroll-area::-webkit-scrollbar {
      width: 3px;
    }
    .wish-scroll-area::-webkit-scrollbar-thumb {
      background: #fecdd3;
      border-radius: 3px;
    }

    .wish-text {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.1rem, 3.8vw, 1.25rem);
      font-weight: 600;
      line-height: 1.45;
      color: #881337;
      text-align: justify;
      white-space: pre-wrap;
    }

    /* Chữ viết tay: từng từ hiện dần như nét mực vừa được viết */
    .handwriting-line {
      display: inline;
    }

    .handwriting-word {
      display: inline-block;
      opacity: 0;
      filter: blur(1.8px);
      transform: translateY(5px) rotate(-2deg);
      transform-origin: left bottom;
      animation: inkWrite 420ms cubic-bezier(.2,.75,.25,1) forwards;
      white-space: pre;
    }

    @keyframes inkWrite {
      0% {
        opacity: 0;
        filter: blur(2px);
        transform: translateY(5px) rotate(-2deg);
      }
      65% {
        opacity: .85;
        filter: blur(.35px);
        transform: translateY(-1px) rotate(.5deg);
      }
      100% {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0) rotate(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .handwriting-word { animation-duration: 1ms; filter: none; transform: none; }
    }

    .page-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed #fecdd3;
      padding-top: 8px;
      font-size: 0.75rem;
      color: #9ca3af;
      flex-shrink: 0;
    }

    .btn-close-card {
      background: var(--card-pink-main);
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(244, 63, 94, 0.3);
      transition: all 0.2s;
    }

    .btn-close-card:hover {
      background: var(--card-pink-dark);
      transform: translateY(-1px);
    }

    /* SVG Họa tiết Hoa góc thiệp */
    .corner-floral {
      position: absolute;
      width: 55px;
      height: 55px;
      pointer-events: none;
      z-index: 2;
    }
    .corner-top-left { top: 0; left: 0; }
    .corner-bottom-right { bottom: 0; right: 0; transform: rotate(180deg); }



  </style>
</head>
<body>

  <!-- Canvas cánh hoa rơi -->
  <canvas id="petal-canvas"></canvas>



  <!-- Toolbar Thu phóng & Đặt lại vị trí -->
  <div class="controls-bar">
    <button class="btn-tool" id="btn-zoom-in" title="Phóng to"><i data-lucide="zoom-in"></i></button>
    <button class="btn-tool" id="btn-zoom-out" title="Thu nhỏ"><i data-lucide="zoom-out"></i></button>
    <button class="btn-tool" id="btn-reset-pos" title="Về chính giữa"><i data-lucide="rotate-ccw"></i></button>
  </div>

  <div class="app-container">
    <div class="drag-wrapper" id="drag-wrapper">
      
      <!-- Thiệp Quyển Sách 3D -->
      <div class="book-container" id="book-card">
        
        <div class="book-cover">
          
          <!-- MẶT 1: BÌA TRƯỚC (Bó Hoa Rực Rỡ) -->
          <div class="page-face page-1">
            <div class="card-subtitle">Tri Ân Ngày 20/11</div>
            
            <div class="flower-illustration">
              <svg viewBox="0 0 220 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bó hoa hồng nhiều màu">
                <defs>
                  <linearGradient id="paper" x1="55" y1="120" x2="170" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF1F2"/><stop offset="1" stop-color="#FDA4AF"/></linearGradient>
                  <linearGradient id="leaf" x1="40" y1="65" x2="170" y2="150" gradientUnits="userSpaceOnUse"><stop stop-color="#86CFA4"/><stop offset="1" stop-color="#15803D"/></linearGradient>
                  <radialGradient id="rose"><stop stop-color="#FFE4E6"/><stop offset=".35" stop-color="#FB7185"/><stop offset="1" stop-color="#BE123C"/></radialGradient>
                  <radialGradient id="peach"><stop stop-color="#FFF7ED"/><stop offset=".4" stop-color="#FDBA74"/><stop offset="1" stop-color="#EA580C"/></radialGradient>
                  <radialGradient id="lilac"><stop stop-color="#F5D0FE"/><stop offset=".45" stop-color="#C084FC"/><stop offset="1" stop-color="#7E22CE"/></radialGradient>
                </defs>
                <ellipse cx="111" cy="213" rx="57" ry="8" fill="#BE123C" opacity=".12"/>
                <!-- stems and leaves -->
                <path d="M107 112 C103 145 91 166 86 193 M112 112 C117 145 132 166 139 193 M99 112 C87 145 73 163 69 187" stroke="#398653" stroke-width="5" stroke-linecap="round"/>
                <path d="M83 151 C48 126 34 140 48 159 C62 171 76 164 83 151Z" fill="url(#leaf)" stroke="#26734A" stroke-width="1.5"/>
                <path d="M130 151 C164 122 181 139 165 159 C151 171 137 164 130 151Z" fill="url(#leaf)" stroke="#26734A" stroke-width="1.5"/>
                <path d="M104 137 C74 110 62 122 77 143 C88 151 99 146 104 137Z" fill="#4DAD70"/>
                <path d="M118 137 C145 108 160 121 145 143 C134 151 123 146 118 137Z" fill="#23834B"/>
                <!-- flower heads: layered petals -->
                <g transform="translate(108 78)">
                  <g fill="#E11D48"><ellipse cy="-19" rx="13" ry="21"/><ellipse cy="19" rx="13" ry="21"/><ellipse cx="-19" rx="21" ry="13"/><ellipse cx="19" rx="21" ry="13"/><ellipse cx="-14" cy="-14" rx="13" ry="20" transform="rotate(-45 -14 -14)"/><ellipse cx="14" cy="-14" rx="13" ry="20" transform="rotate(45 14 -14)"/><ellipse cx="-14" cy="14" rx="13" ry="20" transform="rotate(45 -14 14)"/><ellipse cx="14" cy="14" rx="13" ry="20" transform="rotate(-45 14 14)"/></g>
                  <circle r="15" fill="url(#rose)"/><path d="M-7 1 C-11 -10 4 -14 9 -5 C14 5 1 12 -5 6 C-9 2 -3 -5 2 -3" stroke="#9F1239" stroke-width="3" stroke-linecap="round"/>
                </g>
                <g transform="translate(58 105) scale(.78)">
                  <g fill="#F97316"><ellipse cy="-17" rx="12" ry="19"/><ellipse cy="17" rx="12" ry="19"/><ellipse cx="-17" rx="19" ry="12"/><ellipse cx="17" rx="19" ry="12"/><ellipse cx="-12" cy="-12" rx="12" ry="18" transform="rotate(-45 -12 -12)"/><ellipse cx="12" cy="-12" rx="12" ry="18" transform="rotate(45 12 -12)"/><ellipse cx="-12" cy="12" rx="12" ry="18" transform="rotate(45 -12 12)"/><ellipse cx="12" cy="12" rx="12" ry="18" transform="rotate(-45 12 12)"/></g>
                  <circle r="13" fill="url(#peach)"/><circle r="4" fill="#FFF7ED"/>
                </g>
                <g transform="translate(158 106) scale(.78)">
                  <g fill="#A855F7"><ellipse cy="-17" rx="12" ry="19"/><ellipse cy="17" rx="12" ry="19"/><ellipse cx="-17" rx="19" ry="12"/><ellipse cx="17" rx="19" ry="12"/><ellipse cx="-12" cy="-12" rx="12" ry="18" transform="rotate(-45 -12 -12)"/><ellipse cx="12" cy="-12" rx="12" ry="18" transform="rotate(45 12 -12)"/><ellipse cx="-12" cy="12" rx="12" ry="18" transform="rotate(45 -12 12)"/><ellipse cx="12" cy="12" rx="12" ry="18" transform="rotate(-45 12 12)"/></g>
                  <circle r="13" fill="url(#lilac)"/><circle r="4" fill="#F3E8FF"/>
                </g>
                <!-- tiny filler flowers -->
                <g fill="#FDE68A"><circle cx="82" cy="48" r="4"/><circle cx="88" cy="39" r="3"/><circle cx="78" cy="38" r="3"/><circle cx="143" cy="48" r="4"/><circle cx="150" cy="39" r="3"/><circle cx="139" cy="36" r="3"/></g>
                <!-- wrapping paper -->
                <path d="M49 127 Q107 149 171 126 L145 211 Q111 225 76 211Z" fill="url(#paper)" stroke="#F4728B" stroke-width="2"/>
                <path d="M49 127 Q108 157 171 126 L158 157 Q108 179 62 155Z" fill="#FFF7F8" opacity=".8"/>
                <path d="M108 155 L108 213" stroke="#F9A8D4" stroke-width="2" opacity=".8"/>
                <!-- ribbon -->
                <path d="M108 167 C82 142 66 164 91 178 C99 182 105 177 108 172 C112 180 121 184 133 176 C154 160 132 144 108 167Z" fill="#E11D48" stroke="#9F1239" stroke-width="1.5"/>
                <path d="M106 173 L91 205 L108 198 L119 207 L114 174Z" fill="#FB7185" stroke="#BE123C" stroke-width="1.5"/>
                <circle cx="108" cy="170" r="6" fill="#FDA4AF" stroke="#BE123C" stroke-width="1.5"/>
              </svg>
            </div>

            <div class="card-title-main">Chúc Mừng<br>Ngày Nhà Giáo Việt Nam</div>

            <div class="open-hint" id="hint-click">
              <i data-lucide="sparkles" style="width: 16px; height: 16px;"></i>
              <span>Nhấp để mở thiệp</span>
            </div>
          </div>

          <!-- MẶT 2: TRANG TRONG TRÁI -->
          <div class="page-face page-2">
            <!-- Hoa trang trí góc trên trái -->
            <svg class="corner-floral corner-top-left" viewBox="0 0 100 100" fill="none">
              <path d="M0 0 L80 0 C60 20 40 40 0 80 Z" fill="#FFE4E6"/>
              <circle cx="25" cy="25" r="16" fill="#F43F5E"/>
              <circle cx="25" cy="25" r="10" fill="#FB7185"/>
              <circle cx="55" cy="18" r="10" fill="#E11D48"/>
              <circle cx="18" cy="55" r="10" fill="#E11D48"/>
            </svg>

            <div class="quote-decor">Kính Gửi Cô</div>
            
            <!-- Khung cuộn chống mất chữ -->
            <div class="wish-scroll-area">
              <div class="wish-text" id="wish-text-page2"></div>
            </div>

            <div class="page-footer" style="justify-content: flex-end;">
              <i data-lucide="heart" style="width:15px; height:15px; color:#f43f5e;"></i>
            </div>
          </div>

        </div>

        <!-- MẶT 3: TRANG TRONG PHẢI -->
        <div class="page-face page-3">
          <!-- Hoa trang trí góc dưới phải -->
          <svg class="corner-floral corner-bottom-right" viewBox="0 0 100 100" fill="none">
            <path d="M0 0 L80 0 C60 20 40 40 0 80 Z" fill="#FFE4E6"/>
            <circle cx="25" cy="25" r="16" fill="#F43F5E"/>
            <circle cx="25" cy="25" r="10" fill="#FB7185"/>
            <circle cx="55" cy="18" r="10" fill="#E11D48"/>
            <circle cx="18" cy="55" r="10" fill="#E11D48"/>
          </svg>

          <div class="quote-decor">Lời Tri Ân Sâu Sắc</div>
          
          <!-- Khung cuộn chống mất chữ -->
          <div class="wish-scroll-area">
            <div class="wish-text" id="wish-text-page3"></div>
          </div>

          <div class="page-footer">
            <span>20/11 Tri Ân</span>
            <button class="btn-close-card" id="btn-close">Đóng Thiệp</button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    if (window.lucide) lucide.createIcons();

    // Nội dung lời chúc đã chỉnh xưng "em" / "chúng em" & dành riêng cho Cô Nguyễn Ngọc Hồng Phương
    const textPart1 = "Cảm ơn Cô Nguyễn Ngọc Hồng Phương vì không chỉ mang đến cho chúng em kho tàng tri thức, mà còn bao dung với những lần chúng em ngây ngô, nghịch ngợm. Từng lời răn dạy nghiêm khắc nhưng đầy tình thương, từng ánh mắt lo lắng khi thấy chúng em chểnh mảng học hành... tất cả em đều khắc sâu trong lòng.\n\nCô chính là người đã kiên nhẫn uốn nắn, giúp em trưởng thành và vững vàng hơn từng ngày.";

    const textPart2 = "Nhân ngày đặc biệt này, em kính chúc Cô luôn dồi dào sức khỏe, luôn bình an và giữ mãi ngọn lửa nhiệt huyết với nghề.\n\nMong rằng nụ cười sẽ luôn rạng rỡ trên môi Cô khi nhìn thấy các thế hệ học trò của mình khôn lớn, nên người.\n\nChúng em yêu Cô rất nhiều!";

    const bookCard = document.getElementById('book-card');
    const dragWrapper = document.getElementById('drag-wrapper');
    const btnClose = document.getElementById('btn-close');
    const wishEl2 = document.getElementById('wish-text-page2');
    const wishEl3 = document.getElementById('wish-text-page3');

    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnResetPos = document.getElementById('btn-reset-pos');

    let isOpen = false;
    let handwritingTimers = [];

    let currentScale = 1;
    let posX = 0;
    let posY = 0;

    function updateTransform() {
      dragWrapper.style.transform = `translate(${posX}px, ${posY}px) scale(${currentScale})`;
    }

    function openCard() {
      if (isOpen) return;
      isOpen = true;
      bookCard.classList.add('open');
      startTyping();
    }

    function closeCard(e) {
      if (e) e.stopPropagation();
      if (!isOpen) return;
      isOpen = false;
      bookCard.classList.remove('open');
      clearTyping();
    }

    bookCard.addEventListener('click', (e) => {
      if (!isOpen && !isDragging) {
        openCard();
      }
    });

    btnClose.addEventListener('click', closeCard);

    // Hiệu ứng chữ viết tay: các từ lần lượt hiện ra bằng phông chữ nét viết.
    function startTyping() {
      clearTyping();
      wishEl2.innerHTML = '';
      wishEl3.innerHTML = '';

      function renderHandwriting(element, content, initialDelay) {
        const words = content.split(/(\s+)/);
        let delay = initialDelay;
        words.forEach((part) => {
          if (!part) return;
          if (/^\s+$/.test(part)) {
            element.appendChild(document.createTextNode(part));
            return;
          }
          const span = document.createElement('span');
          span.className = 'handwriting-word';
          span.textContent = part;
          span.style.animationDelay = `${delay}ms`;
          element.appendChild(span);
          delay += 105;
        });
        return delay;
      }

      const endFirst = renderHandwriting(wishEl2, textPart1, 350);
      renderHandwriting(wishEl3, textPart2, endFirst + 250);
    }

    function clearTyping() {
      handwritingTimers.forEach(clearTimeout);
      handwritingTimers = [];
      wishEl2.innerHTML = '';
      wishEl3.innerHTML = '';
    }

    // Zoom & Reset controls
    btnZoomIn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentScale < 1.8) {
        currentScale += 0.15;
        updateTransform();
      }
    });

    btnZoomOut.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentScale > 0.55) {
        currentScale -= 0.15;
        updateTransform();
      }
    });

    btnResetPos.addEventListener('click', (e) => {
      e.stopPropagation();
      currentScale = 1;
      posX = 0;
      posY = 0;
      updateTransform();
    });

    // Kéo thả di chuyển (Drag & Move)
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function onPointerDown(e) {
      if (e.target.closest('.btn-close-card') || e.target.closest('.controls-bar')) return;

      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      startX = clientX - posX;
      startY = clientY - posY;
    }

    function onPointerMove(e) {
      if (!isDragging) return;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      posX = clientX - startX;
      posY = clientY - startY;
      updateTransform();
    }

    function onPointerUp() {
      isDragging = false;
    }

    dragWrapper.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    dragWrapper.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // Canvas cánh hoa hồng rơi 
    const canvas = document.getElementById('petal-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Petal {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.size = Math.random() * 12 + 8;
        this.speedY = Math.random() * 1.5 + 0.8;
        this.speedX = Math.random() * 1 - 0.5;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.02;
        this.color = ['#f43f5e', '#fb7185', '#fda4af', '#fecdd3'][Math.floor(Math.random() * 4)];
        this.opacity = Math.random() * 0.6 + 0.4;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.angle) * 0.8 + this.speedX;
        this.angle += this.spin;

        if (this.y > height + 20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size / 2, -this.size / 2, -this.size, this.size / 3, 0, this.size);
        ctx.bezierCurveTo(this.size, this.size / 3, this.size / 2, -this.size / 2, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }

    const petals = Array.from({ length: 35 }, () => new Petal());

    function animatePetals() {
      ctx.clearRect(0, 0, width, height);
      petals.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animatePetals);
    }

    animatePetals();
  </script>
</body>
</html>
