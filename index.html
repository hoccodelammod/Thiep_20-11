<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thiệp Chúc Mừng 20/11 Tri Ân Cô</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 50%, #fda4af 100%);
      --card-pink-dark: #e11d48;
      --card-pink-main: #f43f5e;
      --gold-accent: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-gradient);
    }

    /* Canvas cánh hoa rơi */
    #petal-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Floating Toolbar */
    .controls-bar {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(225, 29, 72, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .btn-tool {
      background: transparent;
      border: none;
      color: var(--card-pink-dark);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-tool:hover {
      background: rgba(244, 63, 94, 0.15);
      transform: scale(1.1);
    }

    /* Card App Container & Drag Wrapper */
    .app-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .drag-wrapper {
      position: absolute;
      cursor: grab;
      touch-action: none;
      transform-origin: center center;
    }

    .drag-wrapper:active {
      cursor: grabbing;
    }

    /* 3D Book Container */
    .book-container {
      width: 360px;
      height: 520px;
      perspective: 1600px;
      position: relative;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @media (max-width: 480px) {
      .book-container {
        width: 310px;
        height: 480px;
      }
    }

    .book-cover {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .book-container.open .book-cover {
      transform: rotateY(-180deg);
    }

    .book-container.open {
      transform: translateX(50%);
    }

    @media (max-width: 768px) {
      .book-container.open {
        transform: translateX(25%) scale(0.85);
      }
    }

    .page-face {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(159, 18, 57, 0.2);
      overflow: hidden;
      background: #fff;
    }

    /* Mặt 1: Bìa Thiệp */
    .page-1 {
      background: linear-gradient(145deg, #fff1f2 0%, #ffe4e6 100%);
      border: 3px solid #fda4af;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
      text-align: center;
    }

    .page-1::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px dashed #f43f5e;
      border-radius: 10px;
      pointer-events: none;
    }

    /* Mặt 2: Trang trong trái */
    .page-2 {
      transform: rotateY(180deg);
      background: #fff;
      border: 1px solid #fecdd3;
      padding: 24px 18px 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Mặt 3: Trang trong phải */
    .page-3 {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #fff;
      border: 1px solid #fecdd3;
      padding: 24px 18px 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Bó hoa trang trí bìa trước */
    .flower-illustration {
      width: 150px;
      height: 150px;
      position: relative;
      margin: 5px auto;
    }

    .flower-illustration svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 15px rgba(225, 29, 72, 0.25));
    }

    .card-title-main {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.2rem, 6vw, 2.7rem);
      color: var(--card-pink-dark);
      line-height: 1.25;
      margin-top: 5px;
    }

    .card-subtitle {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: var(--gold-accent);
      font-weight: 700;
    }

    .open-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #9f1239;
      background: rgba(244, 63, 94, 0.12);
      padding: 8px 18px;
      border-radius: 20px;
      animation: pulse 2s infinite;
      cursor: pointer;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    /* Lời chúc & Tiêu đề phông Script */
    .quote-decor {
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      color: var(--card-pink-dark);
      text-align: center;
      border-bottom: 1px solid #ffe4e6;
      padding-bottom: 4px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    /* Khung chứa văn bản tự cuộn chống tràn/mất chữ */
    .wish-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 8px;
    }

    /* Tùy chỉnh thanh cuộn siêu mỏng đẹp mắt */
    .wish-scroll-area::-webkit-scrollbar {
      width: 3px;
    }
    .wish-scroll-area::-webkit-scrollbar-thumb {
      background: #fecdd3;
      border-radius: 3px;
    }

    .wish-text {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.1rem, 3.8vw, 1.25rem);
      font-weight: 600;
      line-height: 1.45;
      color: #881337;
      text-align: justify;
      white-space: pre-wrap;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background-color: var(--card-pink-main);
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .page-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed #fecdd3;
      padding-top: 8px;
      font-size: 0.75rem;
      color: #9ca3af;
      flex-shrink: 0;
    }

    .btn-close-card {
      background: var(--card-pink-main);
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(244, 63, 94, 0.3);
      transition: all 0.2s;
    }

    .btn-close-card:hover {
      background: var(--card-pink-dark);
      transform: translateY(-1px);
    }

    /* SVG Họa tiết Hoa góc thiệp */
    .corner-floral {
      position: absolute;
      width: 55px;
      height: 55px;
      pointer-events: none;
      z-index: 2;
    }
    .corner-top-left { top: 0; left: 0; }
    .corner-bottom-right { bottom: 0; right: 0; transform: rotate(180deg); }
  </style>
</head>
<body>

  <!-- Canvas cánh hoa rơi -->
  <canvas id="petal-canvas"></canvas>

  <!-- Toolbar Thu phóng & Đặt lại vị trí -->
  <div class="controls-bar">
    <button class="btn-tool" id="btn-zoom-in" title="Phóng to"><i data-lucide="zoom-in"></i></button>
    <button class="btn-tool" id="btn-zoom-out" title="Thu nhỏ"><i data-lucide="zoom-out"></i></button>
    <button class="btn-tool" id="btn-reset-pos" title="Về chính giữa"><i data-lucide="rotate-ccw"></i></button>
  </div>

  <div class="app-container">
    <div class="drag-wrapper" id="drag-wrapper">
      
      <!-- Thiệp Quyển Sách 3D -->
      <div class="book-container" id="book-card">
        
        <div class="book-cover">
          
          <!-- MẶT 1: BÌA TRƯỚC (Bó Hoa Rực Rỡ) -->
          <div class="page-face page-1">
            <div class="card-subtitle">Tri Ân Ngày 20/11</div>
            
            <div class="flower-illustration">
              <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Nền tỏa sáng -->
                <circle cx="100" cy="105" r="75" fill="#FFE4E6"/>
                <!-- Các Lá cây xanh -->
                <path d="M50 110 C30 90 20 60 45 50 C60 65 65 90 50 110 Z" fill="#10B981"/>
                <path d="M150 110 C170 90 180 60 155 50 C140 65 135 90 150 110 Z" fill="#059669"/>
                <path d="M70 70 C60 40 90 30 100 50 C95 65 85 70 70 70 Z" fill="#34D399"/>
                <!-- Hoa hồng đỏ đậm giữa -->
                <circle cx="100" cy="90" r="32" fill="#E11D48"/>
                <circle cx="100" cy="90" r="24" fill="#F43F5E"/>
                <circle cx="100" cy="90" r="16" fill="#FB7185"/>
                <circle cx="100" cy="90" r="8" fill="#FFF1F2"/>
                <!-- Hoa hồng cam trái -->
                <circle cx="68" cy="102" r="22" fill="#EA580C"/>
                <circle cx="68" cy="102" r="15" fill="#F97316"/>
                <circle cx="68" cy="102" r="8" fill="#FFEDD5"/>
                <!-- Hoa hồng tím phải -->
                <circle cx="132" cy="102" r="22" fill="#D97706"/>
                <circle cx="132" cy="102" r="15" fill="#FBBF24"/>
                <circle cx="132" cy="102" r="8" fill="#FEF3C7"/>
                <!-- Nơ gói bó hoa -->
                <path d="M75 140 L100 120 L125 140 L115 175 L100 150 L85 175 Z" fill="#E11D48"/>
                <circle cx="100" cy="125" r="7" fill="#F43F5E"/>
              </svg>
            </div>

            <div class="card-title-main">Chúc Mừng<br>Ngày Nhà Giáo Việt Nam</div>

            <div class="open-hint" id="hint-click">
              <i data-lucide="sparkles" style="width: 16px; height: 16px;"></i>
              <span>Nhấp để mở thiệp</span>
            </div>
          </div>

          <!-- MẶT 2: TRANG TRONG TRÁI -->
          <div class="page-face page-2">
            <!-- Hoa trang trí góc trên trái -->
            <svg class="corner-floral corner-top-left" viewBox="0 0 100 100" fill="none">
              <path d="M0 0 L80 0 C60 20 40 40 0 80 Z" fill="#FFE4E6"/>
              <circle cx="25" cy="25" r="16" fill="#F43F5E"/>
              <circle cx="25" cy="25" r="10" fill="#FB7185"/>
              <circle cx="55" cy="18" r="10" fill="#E11D48"/>
              <circle cx="18" cy="55" r="10" fill="#E11D48"/>
            </svg>

            <div class="quote-decor">Kính Gửi Cô</div>
            
            <!-- Khung cuộn chống mất chữ -->
            <div class="wish-scroll-area">
              <div class="wish-text" id="wish-text-page2"></div>
            </div>

            <div class="page-footer" style="justify-content: flex-end;">
              <i data-lucide="heart" style="width:15px; height:15px; color:#f43f5e;"></i>
            </div>
          </div>

        </div>

        <!-- MẶT 3: TRANG TRONG PHẢI -->
        <div class="page-face page-3">
          <!-- Hoa trang trí góc dưới phải -->
          <svg class="corner-floral corner-bottom-right" viewBox="0 0 100 100" fill="none">
            <path d="M0 0 L80 0 C60 20 40 40 0 80 Z" fill="#FFE4E6"/>
            <circle cx="25" cy="25" r="16" fill="#F43F5E"/>
            <circle cx="25" cy="25" r="10" fill="#FB7185"/>
            <circle cx="55" cy="18" r="10" fill="#E11D48"/>
            <circle cx="18" cy="55" r="10" fill="#E11D48"/>
          </svg>

          <div class="quote-decor">Lời Tri Ân Sâu Sắc</div>
          
          <!-- Khung cuộn chống mất chữ -->
          <div class="wish-scroll-area">
            <div class="wish-text" id="wish-text-page3"></div>
          </div>

          <div class="page-footer">
            <span>20/11 Tri Ân</span>
            <button class="btn-close-card" id="btn-close">Đóng Thiệp</button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();

    // Nội dung lời chúc đã chỉnh xưng "em" / "chúng em" & dành riêng cho Cô Nguyễn Ngọc Hồng Phương
    const textPart1 = "Cảm ơn Cô Nguyễn Ngọc Hồng Phương vì không chỉ mang đến cho chúng em kho tàng tri thức, mà còn bao dung với những lần chúng em ngây ngô, nghịch ngợm. Từng lời răn dạy nghiêm khắc nhưng đầy tình thương, từng ánh mắt lo lắng khi thấy chúng em chểnh mảng học hành... tất cả em đều khắc sâu trong lòng.\n\nCô chính là người đã kiên nhẫn uốn nắn, giúp em trưởng thành và vững vàng hơn từng ngày.";

    const textPart2 = "Nhân ngày đặc biệt này, em kính chúc Cô luôn dồi dào sức khỏe, luôn bình an và giữ mãi ngọn lửa nhiệt huyết với nghề.\n\nMong rằng nụ cười sẽ luôn rạng rỡ trên môi Cô khi nhìn thấy các thế hệ học trò của mình khôn lớn, nên người.\n\nChúng em yêu Cô rất nhiều!";

    const bookCard = document.getElementById('book-card');
    const dragWrapper = document.getElementById('drag-wrapper');
    const btnClose = document.getElementById('btn-close');
    const wishEl2 = document.getElementById('wish-text-page2');
    const wishEl3 = document.getElementById('wish-text-page3');

    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnResetPos = document.getElementById('btn-reset-pos');

    let isOpen = false;
    let typingTimer1 = null;
    let typingTimer2 = null;

    let currentScale = 1;
    let posX = 0;
    let posY = 0;

    function updateTransform() {
      dragWrapper.style.transform = `translate(${posX}px, ${posY}px) scale(${currentScale})`;
    }

    function openCard() {
      if (isOpen) return;
      isOpen = true;
      bookCard.classList.add('open');
      startTyping();
    }

    function closeCard(e) {
      if (e) e.stopPropagation();
      if (!isOpen) return;
      isOpen = false;
      bookCard.classList.remove('open');
      clearTyping();
    }

    bookCard.addEventListener('click', (e) => {
      if (!isOpen && !isDragging) {
        openCard();
      }
    });

    btnClose.addEventListener('click', closeCard);

    // Hiệu ứng gõ chữ nối tiếp mượt mà
    function startTyping() {
      clearTyping();
      wishEl2.innerHTML = '';
      wishEl3.innerHTML = '';

      let i = 0;
      let j = 0;
      const cursor = '<span class="typing-cursor"></span>';

      function typeP1() {
        if (i < textPart1.length) {
          wishEl2.innerHTML = textPart1.substring(0, i + 1) + cursor;
          i++;
          typingTimer1 = setTimeout(typeP1, 26);
        } else {
          wishEl2.innerHTML = textPart1;
          typeP2();
        }
      }

      function typeP2() {
        if (j < textPart2.length) {
          wishEl3.innerHTML = textPart2.substring(0, j + 1) + cursor;
          j++;
          typingTimer2 = setTimeout(typeP2, 26);
        } else {
          wishEl3.innerHTML = textPart2;
        }
      }

      setTimeout(typeP1, 400);
    }

    function clearTyping() {
      if (typingTimer1) clearTimeout(typingTimer1);
      if (typingTimer2) clearTimeout(typingTimer2);
      wishEl2.innerHTML = '';
      wishEl3.innerHTML = '';
    }

    // Zoom & Reset controls
    btnZoomIn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentScale < 1.8) {
        currentScale += 0.15;
        updateTransform();
      }
    });

    btnZoomOut.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentScale > 0.55) {
        currentScale -= 0.15;
        updateTransform();
      }
    });

    btnResetPos.addEventListener('click', (e) => {
      e.stopPropagation();
      currentScale = 1;
      posX = 0;
      posY = 0;
      updateTransform();
    });

    // Kéo thả di chuyển (Drag & Move)
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function onPointerDown(e) {
      if (e.target.closest('.btn-close-card') || e.target.closest('.controls-bar')) return;

      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      startX = clientX - posX;
      startY = clientY - posY;
    }

    function onPointerMove(e) {
      if (!isDragging) return;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      posX = clientX - startX;
      posY = clientY - startY;
      updateTransform();
    }

    function onPointerUp() {
      isDragging = false;
    }

    dragWrapper.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    dragWrapper.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // Canvas cánh hoa hồng rơi 
    const canvas = document.getElementById('petal-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Petal {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.size = Math.random() * 12 + 8;
        this.speedY = Math.random() * 1.5 + 0.8;
        this.speedX = Math.random() * 1 - 0.5;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.02;
        this.color = ['#f43f5e', '#fb7185', '#fda4af', '#fecdd3'][Math.floor(Math.random() * 4)];
        this.opacity = Math.random() * 0.6 + 0.4;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.angle) * 0.8 + this.speedX;
        this.angle += this.spin;

        if (this.y > height + 20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size / 2, -this.size / 2, -this.size, this.size / 3, 0, this.size);
        ctx.bezierCurveTo(this.size, this.size / 3, this.size / 2, -this.size / 2, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }

    const petals = Array.from({ length: 35 }, () => new Petal());

    function animatePetals() {
      ctx.clearRect(0, 0, width, height);
      petals.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animatePetals);
    }

    animatePetals();
  </script>
</body>
</html>
